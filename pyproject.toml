[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetpathdb"
version = "1.0.0"
description = "AI-powered veterinary pathology database with LLM extraction and semantic search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "veterinary-pathology",
    "digital-pathology",
    "semantic-search",
    "information-extraction",
    "natural-language-processing",
    "large-language-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pymongo>=4.5.0",
    "chromadb>=0.4.15",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "openai>=1.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "aiohttp>=3.9",
    "pandas>=2.0",
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
]
mcp = [
    "fastmcp>=2.0",
]
pdf = [
    "marker-pdf>=1.0.0",
    "pdf2image>=1.16",
    "PyPDF2>=3.0",
    "pytesseract>=0.3.10",
]

[project.urls]
Repository = "https://github.com/dimolabuol/vetpathdb"
Documentation = "https://github.com/dimolabuol/vetpathdb/tree/main/docs"
Issues = "https://github.com/dimolabuol/vetpathdb/issues"

[project.scripts]
vetpathdb = "vetpathdb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
